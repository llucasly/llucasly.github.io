<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography – Lucas Ly</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    a {
      color: #000;
      text-decoration: underline;
    }
    a:hover { text-decoration: none; }

    /* Back link */
    .back {
      display: inline-block;
      margin-bottom: 2.5rem;
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 2.5rem;
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .photo-item img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      filter: grayscale(10%);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .photo-item:hover img {
      filter: grayscale(0%);
      transform: scale(1.02);
    }



    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
    }
    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }

    #lightbox-caption {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #444;
    }

    #lightbox-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      font-size: 1.1rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      color: #000;
      padding: 0;
    }
    #lightbox-close:hover { text-decoration: none; }

    #lightbox-nav {
      margin-top: 1rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
    }
    #lightbox-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      text-decoration: underline;
      color: #000;
      padding: 0;
    }
    #lightbox-nav button:hover { text-decoration: none; }


  </style>
</head>
<body>

  <a class="back" href="https://lucasly.net/">..</a>

  <h1>Photography</h1>
  <p class="subtitle">A collection of photographs.</p>

  <!--
    Replace the src attributes below with your actual image paths.
    You can use relative paths like src="photos/img1.jpg"
    or absolute URLs.
  -->
  <div class="gallery" id="gallery">

    <div class="photo-item" data-index="0">
      <img src="https://www.flickr.com/photo_download.gne?id=55146688064&secret=9bca204d60&size=l&source=photoPageEngagement" alt="Photo 1" />
    </div>

    <div class="photo-item" data-index="1">
      <img src="https://placehold.co/600x450/d8d8d8/555?text=photo+2" alt="Photo 2" />
    </div>

    <div class="photo-item" data-index="2">
      <img src="https://placehold.co/600x450/c8c8c8/555?text=photo+3" alt="Photo 3" />
    </div>

    <div class="photo-item" data-index="3">
      <img src="https://placehold.co/600x450/b8b8b8/555?text=photo+4" alt="Photo 4" />
    </div>

    <div class="photo-item" data-index="4">
      <img src="https://placehold.co/600x450/a8a8a8/666?text=photo+5" alt="Photo 5" />
    </div>

    <div class="photo-item" data-index="5">
      <img src="https://placehold.co/600x450/989898/666?text=photo+6" alt="Photo 6" />
    </div>

  </div>

<!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true">
    <button id="lightbox-close" aria-label="Close">close</button>
    <img id="lightbox-img" src="" alt="" />
    <div id="lightbox-nav">
      <button id="prev-btn">← prev</button>
      <button id="next-btn">next →</button>
    </div>
  </div>

  <script>
    const items = Array.from(document.querySelectorAll('.photo-item'));
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    let current = 0;

    function open(index) {
      current = index;
      const item = items[index];
      lbImg.src = item.querySelector('img').src;
      lbImg.alt = item.querySelector('img').alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      current = (current + dir + items.length) % items.length;
      open(current);
    }

    items.forEach((item, i) => item.addEventListener('click', () => open(i)));
    document.getElementById('lightbox-close').addEventListener('click', close);
    document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
    document.getElementById('next-btn').addEventListener('click', () => navigate(1));

    lb.addEventListener('click', e => { if (e.target === lb) close(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
  </script>

</body>
</html>
