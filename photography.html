<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography – Lucas Ly</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #000;
      background: #fff;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    a { color: #000; text-decoration: underline; }
    a:hover { text-decoration: none; }

    .back {
      display: inline-block;
      margin-bottom: 2.5rem;
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 2.5rem;
    }

    /* Justified gallery */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 3rem;
    }

    .gallery-row {
      display: flex;
      gap: 0.5rem;
    }

    .photo-item {
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(10%);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    .photo-item:hover img {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
    }
    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }

    #lightbox-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      font-size: 1.1rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      color: #000;
      padding: 0;
    }
    #lightbox-close:hover { text-decoration: none; }

    #lightbox-nav {
      margin-top: 1rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
    }
    #lightbox-nav button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      text-decoration: underline;
      color: #000;
      padding: 0;
    }
    #lightbox-nav button:hover { text-decoration: none; }
  </style>
</head>
<body>

  <a class="back" href="https://lucasly.net/">..</a>

  <h1>Photography</h1>
  <p class="subtitle">A collection of photographs.</p>

  <!--
    Add your photos as photo-item divs inside the gallery.
    Set data-width and data-height to the photo's real pixel dimensions
    so the layout calculates correctly before images fully load.
    Example: <div class="photo-item"><img src="myphoto.jpg" data-width="4000" data-height="3000" alt="" /></div>
  -->
  <div class="gallery" id="gallery">

    <div class="photo-item"><img src="https://www.flickr.com/photo_download.gne?id=55146688064&secret=9bca204d60&size=l&source=photoPageEngagement" data-width="600" data-height="400" alt="" /></div>
    <div class="photo-item"><img src="https://www.flickr.com/photo_download.gne?id=55145556267&secret=f65cfbd8da&size=l&source=photoPageEngagement" data-width="400" data-height="600" alt="" /></div>
    <div class="photo-item"><img src="https://www.flickr.com/photo_download.gne?id=55146614973&secret=d3f26ef69a&size=l&source=photoPageEngagement" data-width="800" data-height="500" alt="" /></div>
    <div class="photo-item"><img src="https://www.flickr.com/photo_download.gne?id=55146831130&secret=b7d780156b&size=l&source=photoPageEngagement" data-width="500" data-height="500" alt="" /></div>
    <div class="photo-item"><img src="https://placehold.co/700x400/a8a8a8/555?text=5" data-width="700" data-height="400" alt="" /></div>
    <div class="photo-item"><img src="https://placehold.co/400x700/989898/666?text=6" data-width="400" data-height="700" alt="" /></div>
    <div class="photo-item"><img src="https://placehold.co/600x600/888888/666?text=7" data-width="600" data-height="600" alt="" /></div>
    <div class="photo-item"><img src="https://placehold.co/900x500/787878/666?text=8" data-width="900" data-height="500" alt="" /></div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true">
    <button id="lightbox-close" aria-label="Close">close</button>
    <img id="lightbox-img" src="" alt="" />
    <div id="lightbox-nav">
      <button id="prev-btn">← prev</button>
      <button id="next-btn">next →</button>
    </div>
  </div>

  <script>
    /* ── Justified layout ── */
    function justify() {
      const gallery = document.getElementById('gallery');
      const totalWidth = gallery.clientWidth;
      const gap = 8;
      const targetRowHeight = 200;
      const photos = Array.from(gallery.querySelectorAll('.photo-item'));

      const ratios = photos.map(item => {
        const img = item.querySelector('img');
        const w = parseFloat(img.dataset.width) || img.naturalWidth || 1;
        const h = parseFloat(img.dataset.height) || img.naturalHeight || 1;
        return w / h;
      });

      // Detach items, clear gallery
      gallery.innerHTML = '';

      let i = 0;
      while (i < photos.length) {
        let rowRatioSum = 0;
        let j = i;

        while (j < photos.length) {
          rowRatioSum += ratios[j];
          const rowWidth = rowRatioSum * targetRowHeight + gap * (j - i);
          j++;
          if (rowWidth >= totalWidth) break;
        }

        const rowPhotos = photos.slice(i, j);
        const rowRatios = ratios.slice(i, j);
        const totalRatio = rowRatios.reduce((a, b) => a + b, 0);
        const rowHeight = (totalWidth - gap * (rowPhotos.length - 1)) / totalRatio;

        const row = document.createElement('div');
        row.className = 'gallery-row';
        gallery.appendChild(row);

        rowPhotos.forEach((item, k) => {
          item.style.width = Math.floor(rowRatios[k] * rowHeight) + 'px';
          item.style.height = Math.floor(rowHeight) + 'px';
          row.appendChild(item);
        });

        i = j;
      }
    }

    justify();
    window.addEventListener('load', justify);
    window.addEventListener('resize', justify);

    /* ── Lightbox ── */
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    let current = 0;

    function getItems() {
      return Array.from(document.querySelectorAll('.photo-item'));
    }

    function openLightbox(index) {
      current = index;
      const img = getItems()[index].querySelector('img');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      const items = getItems();
      current = (current + dir + items.length) % items.length;
      openLightbox(current);
    }

    document.getElementById('gallery').addEventListener('click', e => {
      const item = e.target.closest('.photo-item');
      if (!item) return;
      openLightbox(getItems().indexOf(item));
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('prev-btn').addEventListener('click', () => navigate(-1));
    document.getElementById('next-btn').addEventListener('click', () => navigate(1));
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });
  </script>

</body>
</html>
